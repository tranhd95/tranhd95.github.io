base_url = "https://tranhd95.github.io"
title = "Hai Duong Tran"
description = "Hai Duong Tran's personal website."
build_search_index = false
generate_feeds = true
compile_sass = true
minify_html = true
taxonomies = [{ name = "tags" }]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
highlight_code = true
highlight_theme = "ayu-light"

[extra]
toc = false
use_cdn = false
favicon = "/icon/favicon.png"
theme = "toggle"              # light, dark, auto, toggle
fancy_code = true
dynamic_note = true           # a note that can be toggled
mathjax = true
mathjax_dollar_inline_enable = true

menu = [
    { name = "/posts", url = "/posts", weight = 1 },
    { name = "/about", url = "/about", weight = 2 },
]

socials = [
    { name = "github", url = "https://github.com/tranhd95/", icon = "github" },
    { name = "twitter", url = "https://x.com/PhoBoAI", icon = "twitter" },
    { name = "linkedin", url = "https://www.linkedin.com/in/hai-duong-tran/", icon = "linkedin" },
    { name = "discord", url = "https://discordapp.com/users/451786108578299915", icon = "discord" },
]

custom_css = []

[extra.analytics]
enabled = false

